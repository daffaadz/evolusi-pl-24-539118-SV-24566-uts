services:
  # ==============================================================================
  # SERVICE 1: DATABASE (MariaDB 11.4 LTS)
  # Data persistence with named volume and automated readiness healthcheck
  # ==============================================================================
  database:
    image: mariadb:11.4
    container_name: laravel_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel_uts}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - uts_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ==============================================================================
  # SERVICE 2: BACKEND (FrankenPHP + Laravel 11/12)
  # High-performance Caddy server with non-root security and auto-migrations
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laravel_backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_NAME: "${APP_NAME:-Laravel UTS}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-laravel_uts}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD}"
      SERVER_NAME: ":8000"
    volumes:
      - storage_data:/app/storage
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - uts_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/up"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # SERVICE 3: FRONTEND (Vue 3 SPA + Nginx Reverse Proxy)
  # Decoupled SPA serving UI and reverse-proxying /api to backend service
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: laravel_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - uts_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

# ==============================================================================
# BRIDGE NETWORK
# Isolated private network enabling inter-container DNS service resolution
# ==============================================================================
networks:
  uts_network:
    driver: bridge

# ==============================================================================
# NAMED VOLUMES
# Persistent storage for MariaDB tables and Laravel application logs/cache
# ==============================================================================
volumes:
  db_data:
    driver: local
  storage_data:
    driver: local

